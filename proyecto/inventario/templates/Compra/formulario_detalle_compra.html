{% extends 'base.html' %}
{% load static %}

{% block cuerpo %}
<div class="container-lg">
    <h1 class="display-4" style="text-align: center;">Agregar Producto - Compra #{{ compra.id }}</h1>
    <p><strong>Proveedor:</strong> {{ compra.proveedor.nombre }}</p>
    <form action="" method="post">
        {% csrf_token %}
        <div class="row align-items-start">
            <div class="col">
                <label class="form-label">Producto</label>
                <select name="producto" class="form-select" required>
                    <option value="">Seleccione el producto</option>
                    {% for p in productos %}
                        <option value="{{ p.id }}" {% if datos.producto == p.id|stringformat:"s" %}selected{% endif %}>{{ p.nombre }} - {{ p.talla }} - {{ p.color }}</option>
                    {% endfor %}
                </select>
                <br>
                <label class="form-label">Cantidad</label>
                <input value="{{ datos.cantidad }}" type="number" name="cantidad" min="1" placeholder="Cantidad" class="form-control" required>
                <br>
                <label class="form-label">Precio unitario</label>
                <input value="{{ datos.precio_unitario }}" type="number" name="precio_unitario" min="0" step="any" placeholder="Precio unitario" class="form-control" required>
                <br>
            </div>
            <div class="zona_botones">
                <div class="col-4 d-grid mx-auto">
                    <button type="submit" class="btn btn-success">Agregar</button>
                </div>
            </div>
        </div>
    </form>
    <br>
    <a href="{% url 'inventario:detalle_compra' compra.id %}" class="btn btn-outline-secondary">Volver al Detalle</a>
</div>
{% endblock %}
