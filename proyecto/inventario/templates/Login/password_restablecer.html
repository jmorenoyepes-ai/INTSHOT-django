{% extends 'Login/base_login.html' %}
{% load static %}

{% block cuerpo %}
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-card-header">
            <img src="{% static 'img/logo-intshot-icon.png' %}" alt="INTSHOT" class="auth-logo-img" style="width:64px; height:64px; object-fit:contain;">
            <h1 class="auth-title">Nueva contraseña</h1>
            <p class="auth-subtitle">Digita tu nueva contraseña. Debe tener mínimo 5 caracteres.</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="auth-field">
                <label class="form-label" for="id_password">Nueva contraseña</label>
                <div class="input-icon-group">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" id="id_password" class="form-control" name="password" placeholder="········" required>
                    <button type="button" class="toggle-password" data-target="id_password" aria-label="Mostrar contraseña">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <div class="auth-field">
                <label class="form-label" for="id_veri_password">Confirmar contraseña</label>
                <div class="input-icon-group">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" id="id_veri_password" class="form-control" name="veri_password" placeholder="········" required>
                    <button type="button" class="toggle-password" data-target="id_veri_password" aria-label="Mostrar contraseña">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-auth mt-2 mb-3">Restablecer contraseña</button>

            <p class="auth-footer">
                <a href="{% url 'inventario:login' %}">Volver a iniciar sesión</a>
            </p>
        </form>
    </div>
</div>

<script>
document.querySelectorAll('.toggle-password').forEach(function (btn) {
    btn.addEventListener('click', function () {
        var input = document.getElementById(btn.getAttribute('data-target'));
        var icon = btn.querySelector('.material-symbols-outlined');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility';
        }
    });
});
</script>
{% endblock %}
