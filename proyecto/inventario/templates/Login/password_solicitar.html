{% extends 'Login/base_login.html' %}
{% load static %}

{% block cuerpo %}
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-card-header">
            <img src="{% static 'img/logo-intshot-icon.png' %}" alt="INTSHOT" class="auth-logo-img" style="width:64px; height:64px; object-fit:contain;">
            <h1 class="auth-title">Recuperar contraseña</h1>
            <p class="auth-subtitle">Escribe tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="auth-field">
                <label class="form-label" for="id_correo">Correo electrónico</label>
                <div class="input-icon-group">
                    <span class="material-symbols-outlined">mail</span>
                    <input value="{{ datos.correo }}" type="email" id="id_correo" class="form-control" name="correo" placeholder="correo@ejemplo.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-auth mt-2 mb-3">Enviar enlace</button>

            <p class="auth-footer">
                <a href="{% url 'inventario:login' %}">Volver a iniciar sesión</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
