{% extends 'Login/base_login.html' %}
{% load static %}
 
{% block cuerpo %}
<div class="auth-page">
    <div class="auth-card">
 
        <div class="auth-card-header">
            <img src="{% static 'img/logo-intshot-icon.png' %}" alt="INTSHOT" class="auth-logo-img" style="width:64px; height:64px; object-fit:contain;">
            <h1 class="auth-title">INTSHOT</h1>
            <p class="auth-subtitle">Crea tu cuenta para comenzar a gestionar tu inventario.</p>
        </div>
 
        <form method="post">
            {% csrf_token %}
 
            <div class="row">
                <div class="col-md-6 auth-field">
                    <label class="form-label" for="id_nombre">Nombre</label>
                    <div class="input-icon-group">
                        <span class="material-symbols-outlined">person</span>
                        <input value="{{ datos.nombre }}" type="text" id="id_nombre" class="form-control" name="nombre" placeholder="Ej: Juan" required>
                    </div>
                </div>
                <div class="col-md-6 auth-field">
                    <label class="form-label" for="id_apellido">Apellido</label>
                    <div class="input-icon-group">
                        <span class="material-symbols-outlined">badge</span>
                        <input value="{{ datos.apellido }}" type="text" id="id_apellido" class="form-control" name="apellido" placeholder="Ej: Pérez" required>
                    </div>
                </div>
            </div>
 
            <div class="row">
                <div class="col-md-6 auth-field">
                    <label class="form-label" for="id_correo">Correo electrónico</label>
                    <div class="input-icon-group">
                        <span class="material-symbols-outlined">mail</span>
                        <input value="{{ datos.correo }}" type="email" id="id_correo" class="form-control" name="correo" placeholder="correo@ejemplo.com" required>
                    </div>
                </div>
                <div class="col-md-6 auth-field">
                    <label class="form-label" for="id_telefono">Teléfono</label>
                    <div class="input-icon-group">
                        <span class="material-symbols-outlined">call</span>
                        <input value="{{ datos.telefono }}" type="text" id="id_telefono" class="form-control" name="telefono" placeholder="3001234567" required>
                    </div>
                </div>
            </div>
 
            <div class="row">
                <div class="col-md-6 auth-field">
                    <label class="form-label" for="id_password">Contraseña</label>
                    <div class="input-icon-group">
                        <span class="material-symbols-outlined">lock</span>
                        <input type="password" id="id_password" class="form-control" name="password" placeholder="········" required>
                        <button type="button" class="toggle-password" data-target="id_password" aria-label="Mostrar contraseña">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="col-md-6 auth-field">
                    <label class="form-label" for="id_veri_password">Confirmar contraseña</label>
                    <div class="input-icon-group">
                        <span class="material-symbols-outlined">lock</span>
                        <input type="password" id="id_veri_password" class="form-control" name="veri_password" placeholder="········" required>
                        <button type="button" class="toggle-password" data-target="id_veri_password" aria-label="Mostrar contraseña">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
            </div>
 
            <button type="submit" class="btn btn-auth mt-2">Registrarse</button>
 
            <p class="auth-footer">
                ¿Ya tienes cuenta? <a href="{% url 'inventario:login' %}">Iniciar sesión</a>
            </p>
        </form>
    </div>
</div>
 
<script>
document.querySelectorAll('.toggle-password').forEach(function (btn) {
    btn.addEventListener('click', function () {
        var input = document.getElementById(btn.getAttribute('data-target'));
        var icon = btn.querySelector('.material-symbols-outlined');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility';
        }
    });
});
</script>
{% endblock %}
