{% extends 'base.html' %}
{% load static %}

{% block cuerpo %}

<div class="container-lg">

    <h1 class="display-4" style="text-align: center;">Proveedores</h1>
    <a class="btn btn-success" href="{% url 'inventario:crear_proveedor' %}">Crear Proveedor</a>
    <table class="table table-sm table-hover">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Telefono</th>
                <th scope="col">Correo</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody class="table-group-divider">
            {% for i in datos %}
            <tr>
                <td>{{ i.id }}</td>
                <td>{{ i.nombre }}</td>
                <td>{{ i.telefono }}</td>
                <td>{{ i.correo }}</td>
                <td>
                    <button
                        onclick="modal_eliminar('Proveedor', 'Está seguro de eliminar el proveedor <strong>{{ i.nombre }}</strong>?', `{% url 'inventario:eliminar_proveedor' i.id %}`);"
                        type="button" class="btn btn-danger" data-bs-toggle="modal"
                        data-bs-target="#confirmacion">Eliminar</button>

                    <a href="{% url 'inventario:actualizar_proveedor' i.id %}" class="btn btn-info" type="button">Editar</a>

                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <nav aria-label="Page navigation example">
        <ul class="pagination">
            <li class="page-item"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
    </nav>
</div>
{% endblock %}
