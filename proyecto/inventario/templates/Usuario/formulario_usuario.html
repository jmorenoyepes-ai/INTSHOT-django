{% extends 'base.html' %}
{% load static %}

{% block cuerpo %}
<div class="container-lg py-3">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            
            {% if datos %}
                <h1 class="display-4">Actualizar Usuario: {{ datos.nombre }} {{ datos.apellido }}</h1>
            {% else %}
                <h1 class="display-4">Crear Usuario</h1>
            {% endif %}
            <p class="text-muted mb-4">Complete los campos requeridos para el usuario.</p>

            <form action="" method="post">
                {% csrf_token %}
                
                <div class="row g-3">
                    <!-- Columna Izquierda -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input value="{{ datos.nombre }}" type="text" name="nombre" placeholder="Nombre del Usuario" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input value="{{ datos.apellido }}" type="text" name="apellido" placeholder="Apellido del Usuario" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input value="{{ datos.correo }}" type="email" name="correo" placeholder="Correo del Usuario" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" placeholder="Digite la contraseña" class="form-control">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Confirmar Contraseña</label>
                            <input type="password" name="veri_password" placeholder="Repita la contraseña" class="form-control">
                        </div>
                    </div>

                    <!-- Columna Derecha -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input value="{{ datos.telefono }}" type="text" name="telefono" placeholder="Teléfono del Usuario" class="form-control">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Rol del Usuario</label>
                            <select name="rol" class="form-select" required>
                                <option value="">Seleccione el Rol</option>
                                <option value="Administrador" {% if datos.rol == 'Administrador' %}selected{% endif %}>Administrador</option>
                                <option value="Empleado" {% if datos.rol == 'Empleado' %}selected{% endif %}>Empleado</option>
                                <option value="Cliente" {% if datos.rol == 'Cliente' %}selected{% endif %}>Cliente</option>
                            </select>
                        </div>
                    </div>

                    <!-- Botones -->
                    <div class="col-12 mt-4 text-center">
                        <button type="submit" class="btn btn-success px-5">Guardar</button>
                    </div>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
