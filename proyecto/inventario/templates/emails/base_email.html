<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background-color:#f1f5f9; font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden;">
                    <tr>
                        <td style="background-color:#0f172a; padding:24px 32px;">
                            <h1 style="margin:0; color:#ffffff; font-size:22px; letter-spacing:2px;">INTSHOT</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            {% block contenido %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#f1f5f9; padding:16px 32px; color:#64748b; font-size:12px; text-align:center;">
                            {% block pie %}INTSHOT - Sistema de gestión de inventario{% endblock %}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
