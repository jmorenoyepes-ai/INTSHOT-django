{% extends 'base.html' %}
{% load static %}

{% block cuerpo %}
<div class="container-lg">
    <div class="container text-center"></div>
        {% if datos %}
            <h1 class="display-4" style="text-align: center;">Actualizar Proveedor: {{datos}}</h1>
        {% else %}
            <h1 class="display-4" style="text-align: center;">Crear Proveedor</h1>
        {% endif %}
        <form action="" method="post">
            {% csrf_token %}
            <div class="row align-items-start">
                <div class="col">
                    <input value="{{datos.nombre}}" type="text" name="nombre" placeholder="Nombre del Proveedor" class="form-control">
                    <br>
                    <input value="{{datos.telefono}}" type="text" name="telefono" placeholder="Telefono del Proveedor" class="form-control">
                    <br>
                    <input value="{{datos.correo}}" type="email" name="correo" placeholder="Correo del Proveedor" class="form-control">
                    <br>           
                </div>
                <div class="zona_botones">
                    <div class="col-4 d-grid mx-auto">
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
